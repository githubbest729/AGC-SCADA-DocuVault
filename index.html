<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================
     CHARSET / VIEWPORT / TITLE
     ============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="Offline-first SCADA documentation manager for Al Gurg Automation & Controls — network architecture, PLC configs, HMI specs, and site notes.">
<meta name="author" content="Christian Tosita Espinosa, SCADA Engineer — Al Gurg Automation & Controls">
<link rel="canonical" href="https://YOUR-DEPLOY-DOMAIN/index.html">

<!-- ============================================================
     PWA MANIFEST + THEME COLOR
     ============================================================ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark">

<!-- ============================================================
     STANDARD FAVICONS
     ============================================================ -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

<!-- ============================================================
     iOS / SAFARI (Apple touch icons + web-app meta tags)
     ============================================================ -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DocuVault">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="AGC SCADA DocuVault">
<meta name="format-detection" content="telephone=no">

<!-- ============================================================
     MICROSOFT / WINDOWS TILES
     ============================================================ -->
<meta name="msapplication-config" content="/browserconfig.xml">
<meta name="msapplication-TileColor" content="#0f172a">
<meta name="msapplication-TileImage" content="/icons/icon-192.png">
<meta name="msapplication-tap-highlight" content="no">

<!-- ============================================================
     OPEN GRAPH (Facebook, LinkedIn, Slack, WhatsApp previews)
     ============================================================ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="AGC SCADA DocuVault">
<meta property="og:title" content="AGC SCADA DocuVault">
<meta property="og:description" content="Offline-first SCADA documentation manager for Al Gurg Automation & Controls — network architecture, PLC configs, HMI specs, and site notes.">
<meta property="og:url" content="https://YOUR-DEPLOY-DOMAIN/index.html">
<meta property="og:image" content="https://YOUR-DEPLOY-DOMAIN/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="AGC SCADA DocuVault — offline SCADA documentation manager">
<meta property="og:locale" content="en_US">

<!-- ============================================================
     TWITTER / X CARD
     ============================================================ -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AGC SCADA DocuVault">
<meta name="twitter:description" content="Offline-first SCADA documentation manager for Al Gurg Automation & Controls.">
<meta name="twitter:image" content="https://YOUR-DEPLOY-DOMAIN/assets/twitter-card.png">
<meta name="twitter:image:alt" content="AGC SCADA DocuVault — offline SCADA documentation manager">

<!-- ============================================================
     STYLESHEET
     ============================================================ -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-mark">AGC</span>
        <span class="brand-name">SCADA DocuVault</span>
      </div>
      <button id="btn-new-doc" class="btn btn-accent" title="New blank document">+ New</button>
    </div>

    <div class="sidebar-actions">
      <button id="btn-new-template" class="btn btn-ghost">📄 New from Template</button>
      <input id="search-input" type="search" placeholder="Search documents…" autocomplete="off">
    </div>

    <nav id="folder-tree" aria-label="Document categories"></nav>

    <div class="sidebar-footer">
      <span id="storage-status">● IndexedDB ready</span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main id="main-panel">

    <!-- Empty state -->
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">🗂️</div>
      <h2>No document selected</h2>
      <p>Select a document from the sidebar, or create a new one to get started.</p>
    </div>

    <!-- Document workspace (hidden until a doc is open) -->
    <div id="doc-workspace" class="hidden">

      <div class="doc-toolbar">
        <input id="doc-title" type="text" placeholder="Document title…" autocomplete="off">

        <select id="doc-category" title="Category">
          <option>Network Architecture</option>
          <option>PLC Configurations</option>
          <option>HMI/SCADA Design Specs</option>
          <option>User Manuals</option>
          <option>Site Notes</option>
        </select>

        <div class="toolbar-spacer"></div>

        <span id="save-indicator" class="save-indicator">Saved</span>
        <button id="btn-save" class="btn btn-ghost">💾 Save</button>
        <button id="btn-export-pdf" class="btn btn-accent">⬇ Generate Official PDF</button>
        <button id="btn-delete-doc" class="btn btn-danger" title="Delete document">🗑</button>
      </div>

      <div class="editor-preview-split" id="split-container">
        <section class="pane editor-pane">
          <div class="pane-header">
            <span>MARKDOWN</span>
            <span class="hint">Paste (Ctrl+V) an image to embed it</span>
          </div>
          <textarea id="md-editor" spellcheck="false" placeholder="# Start typing your SCADA documentation here…"></textarea>
        </section>

        <div class="split-handle" id="split-handle"></div>

        <section class="pane preview-pane">
          <div class="pane-header">
            <span>LIVE PREVIEW</span>
          </div>
          <div id="md-preview" class="markdown-body"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<!-- ============ TEMPLATE MODAL ============ -->
<div id="template-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3>New Document from Template</h3>
      <button id="template-modal-close" class="btn-icon">✕</button>
    </div>
    <div class="modal-body">
      <ul id="template-list" class="template-list"></ul>
    </div>
  </div>
</div>

<!-- ============ HIDDEN PDF EXPORT ROOT ============ -->
<div id="pdf-export-root" class="pdf-export-root"></div>

<!-- ============================================================
     SCRIPTS (Loaded exactly once at the end of the body)
     ============================================================ -->
<!-- 1. External Libraries -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- 2. Core Logic -->
<script src="database.js"></script>
<script src="seed-data.js"></script> <!-- Must load after DB, before App -->
<script src="app.js"></script>

<!-- 3. PWA Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(err => {
        console.warn('Service Worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
